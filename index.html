 /* SPLASH SCREEN */
 .splashScreen {
   position: fixed;
   inset: 0;

 .splashTitle {

 }

   background: linear-gradient(90deg, var(--cyan), var(--blue), var(--gold), var(--cyan));
   background-size: 300% auto;

   background-clip: text;
   -webkit-text-fill-color: transparent;
   animation: shimmerText 2.5s linear infinite;
 }

 .splashSub {

 }

 @keyframes shimmerText {
   to { background-position: -200% center; }
 }

   display: block;

   from {
     opacity: 0;
     transform: translateY(6px);
   }
   to {
     opacity: 1;

 .clickPanel {
   min-height: 480px;
   padding: 30px 20px 40px;

   align-items: center;
   justify-content: center;
   text-align: center;
   position: relative;
   overflow: hidden;
 }

 .clickPanel::before {
   content: "";

   width: 320px;
   height: 320px;
   background: var(--cyan);
   filter: blur(140px);
